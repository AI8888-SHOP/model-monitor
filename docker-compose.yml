services:
  model-monitor:
    image: model-monitor:3.0.1
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: model-monitor
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: "/app/data"
      SUB2API_HOST: "${SUB2API_HOST:-host.docker.internal}"
      SUB2API_PORT: "${SUB2API_PORT:-8080}"
      LISTEN_PORT: "${LISTEN_PORT:-8020}"
      LISTEN_HOST: "${LISTEN_HOST:-127.0.0.1}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      CHECK_INTERVAL: "${CHECK_INTERVAL:-60}"
      TIMEOUT: "${TIMEOUT:-60}"
      MAX_WORKERS: "${MAX_WORKERS:-16}"
      HISTORY_RETENTION_HOURS: "${HISTORY_RETENTION_HOURS:-72}"
      TEST_PROMPT: "${TEST_PROMPT:-Hi}"
      EXCLUDED_MODELS: "${EXCLUDED_MODELS:-mimo-v2.5-tts,qwen3.5,minimax-m2.5}"
      API_KEY: "${API_KEY:-}"
      QQ_BOT_APP_ID: "${QQ_BOT_APP_ID:-}"
      QQ_BOT_APP_SECRET: "${QQ_BOT_APP_SECRET:-}"
      QQ_GROUP_OPENID: "${QQ_GROUP_OPENID:-}"
